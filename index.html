<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ControlIQ - AI-Powered Control Testing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --bg:#0E0E12;
    --sidebar:#0A0A0D;
    --panel:#17171C;
    --panel-2:#1E1E25;
    --border:rgba(255,255,255,.09);
    --border-soft:rgba(255,255,255,.06);
    --text:#FFFFFF;
    --text-dim:#CACAD1;
    --text-mute:#8C8C95;
    --accent:#8B5CF6;
    --accent-strong:#6D28D9;
    --accent-glow:139,92,246;
    --coral:#FF5568;
    --success:#3ED598;
    --success-ink:#063324;
    --amber:#FFC24B;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
    --font: 'Funnel Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  *{margin:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#fff;}

  .app{
    display:flex;
    min-height:100vh;
  }

  .sidebar{
    width:272px;
    flex:0 0 272px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:22px 18px 16px;
    gap:22px;
  }
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:var(--accent-strong);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:.2px;
    flex:0 0 auto;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text strong{font-size:16px;font-weight:700;color:#fff;}
  .brand-text span{font-size:11.5px;color:#9DA0A8;}

  .stepper{display:flex;flex-direction:column;gap:2px;}
  .step-node{
    display:flex;align-items:flex-start;gap:11px;
    padding:9px 8px;border-radius:var(--radius-md);
    cursor:default;
    position:relative;
  }
  .step-node.clickable{cursor:pointer;}
  .step-node.clickable:hover{background:rgba(255,255,255,.04);}
  .step-node:not(:last-child)::before{
    content:'';position:absolute;left:23px;top:34px;width:1px;height:20px;
    background:var(--border);
  }
  .node-dot{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;
    border:1.5px solid #3A3E46;color:#6C7078;background:transparent;
    transition:all .25s ease;
  }
  .step-node[data-status="active"] .node-dot{
    border-color:var(--accent);color:var(--accent);
    box-shadow:0 0 0 3px rgba(var(--accent-glow),.18);
  }
  .step-node[data-status="done"] .node-dot{
    border-color:var(--success);background:var(--success);color:var(--success-ink);
  }
  .node-body{display:flex;flex-direction:column;padding-top:1px;}
  .node-label{font-size:13px;font-weight:600;color:#7D8088;}
  .step-node[data-status="active"] .node-label{color:#fff;}
  .step-node[data-status="done"] .node-label{color:#D6D8DC;}
  .node-sub{font-size:11px;color:#5E6167;margin-top:1px;}
  .step-node[data-status="active"] .node-sub{color:var(--accent);}
  .step-node[data-status="done"] .node-sub{color:var(--success);}

  .rp-widget{
    margin-top:auto;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:14px 14px 15px;
  }
  .rp-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#fff;margin-bottom:10px;}
  .rp-pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(var(--accent-glow),.6); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--accent-glow),.55);}70%{box-shadow:0 0 0 6px rgba(var(--accent-glow),0);}100%{box-shadow:0 0 0 0 rgba(var(--accent-glow),0);}}
  .rp-tag{margin-left:auto;font-size:9.5px;font-weight:600;color:#8B8E96;background:rgba(255,255,255,.06);
    padding:2px 6px;border-radius:20px;}
  .rp-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:#8B8E96;margin-top:7px;}
  .rp-row strong{color:#fff;font-size:12.5px;font-weight:700;}
  .rp-bar-track{height:5px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .rp-bar-fill{height:100%;background:var(--accent);border-radius:4px;width:0%;transition:width .6s ease;}
  .sidebar-foot{font-size:10.5px;color:#54575D;line-height:1.5;padding:0 2px;}

  .main{
    flex:1;
    min-width:0;
    padding:34px 44px 60px;
    max-width:980px;
  }
  .page-head{margin-bottom:26px;}
  .kicker{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-mute);font-weight:600;margin-bottom:9px;}
  .kicker .agent-icon{width:20px;height:20px;border-radius:6px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}
  h1{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:6px;}
  .lede{font-size:14.5px;color:var(--text-dim);max-width:64ch;line-height:1.55;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:4px 10px 4px 8px;border-radius:20px;
  }
  .badge.ok{background:rgba(62,213,152,.14);color:var(--success);}
  .badge.live{background:rgba(255,79,89,.14);color:var(--coral);}
  .badge.live .lv-dot{width:6px;height:6px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite;}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
  }
  .panel + .panel{margin-top:16px;}

  .drop{
    border:1.5px dashed var(--border);
    border-radius:var(--radius-lg);
    padding:38px 26px;
    text-align:center;
    background:var(--panel);
    transition:border-color .2s ease;
  }
  .drop.chosen{border-color:var(--success);border-style:solid;background:var(--panel);}
  .drop-icon{width:46px;height:46px;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--accent);}
  .drop h3{font-size:15px;font-weight:700;margin-bottom:5px;}
  .drop p{font-size:13px;color:var(--text-mute);max-width:44ch;margin:0 auto 16px;line-height:1.5;}
  .file-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--border);padding:7px 8px 7px 12px;border-radius:9px;font-size:12.5px;margin-top:4px;
  }
  .file-chip svg{color:var(--success);flex:0 0 auto;}

  .btn{
    appearance:none;border:none;cursor:pointer;font-family:var(--font);
    font-size:13.5px;font-weight:700;border-radius:9px;padding:11px 18px;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .12s ease, opacity .2s ease, background .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent-strong);color:#fff;}
  .btn-primary:hover{background:var(--accent);}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{background:rgba(255,255,255,.05);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn.hidden-cta{opacity:0;pointer-events:none;transform:translateY(4px);}
  .btn.show{opacity:1;pointer-events:auto;transform:translateY(0);}

  .sample-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

  .agent-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:28px;
  }
  .agent-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .agent-avatar{
    width:48px;height:48px;border-radius:12px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;
    border:1px solid var(--border);
  }
  .agent-top h2{font-size:17px;font-weight:700;margin-bottom:2px;}
  .agent-top p{font-size:12.5px;color:var(--text-mute);}

  #agentSteps{display:flex;flex-direction:column;}
  .step-row{
    display:flex;align-items:center;gap:14px;padding:13px 4px;
    border-top:1px solid var(--border-soft);
  }
  .step-row:first-child{border-top:none;}
  .step-circle{
    width:26px;height:26px;border-radius:50%;flex:0 0 auto;
    border:1.5px solid #3A3E46;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .step-row .step-text{font-size:13.5px;color:var(--text-mute);transition:color .2s ease;}
  .step-row.active .step-text{color:var(--text);}
  .step-row.done .step-text{color:var(--text-dim);}
  .step-row.active .step-circle{border-color:var(--accent);}
  .step-row.active .step-circle::after{
    content:'';position:absolute;inset:-1.5px;border-radius:50%;
    border:1.5px solid transparent;border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .step-row.active .step-circle::after{animation:none;}
    .rp-pulse, .badge.live .lv-dot{animation:none;}
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .step-row.done .step-circle{background:var(--success);border-color:var(--success);}
  .step-row.done .step-circle svg{display:block;}
  .step-row:not(.done) .step-circle svg{display:none;}
  .step-tag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--text-mute);letter-spacing:.2px;}
  .step-row.active .step-tag{color:var(--accent);}
  .step-row.done .step-tag{color:var(--success);}

  .working-foot{margin-top:24px;display:flex;justify-content:flex-end;}

  .fivewh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .fivewh .cell{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 13px;}
  .fivewh .cell .k{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  .fivewh .cell .v{font-size:12.5px;color:var(--text-dim);line-height:1.45;}

  .control-card{border-top:1px solid var(--border-soft);padding:18px 2px;}
  .control-card:first-child{border-top:none;padding-top:4px;}
  .control-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .control-head h4{font-size:14.5px;font-weight:700;}
  .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel-2);color:var(--text-mute);border:1px solid var(--border);}
  .pill.risk-high{color:var(--coral);border-color:rgba(255,79,89,.35);}
  .pill.risk-med{color:var(--amber);border-color:rgba(255,194,75,.35);}
  .pill.risk-low{color:var(--success);border-color:rgba(62,213,152,.35);}
  .qa-list{margin-top:9px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .qa-list li{font-size:12.5px;color:var(--text-dim);padding-left:16px;position:relative;line-height:1.5;}
  .qa-list li::before{content:'?';position:absolute;left:0;top:0;color:var(--accent);font-weight:700;font-size:11px;}
  .narrative{font-size:13px;color:var(--text-dim);line-height:1.65;margin-top:2px;}
  .tag-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  table.dtable{width:100%;border-collapse:collapse;font-size:12.8px;}
  table.dtable th{
    text-align:left;font-size:11px;color:var(--text-mute);font-weight:700;
    padding:0 10px 9px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.dtable td{padding:12px 10px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);vertical-align:top;}
  table.dtable tr:last-child td{border-bottom:none;}
  table.dtable td.strong{color:var(--text);font-weight:600;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .stat{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 15px;display:flex;flex-direction:column-reverse;gap:5px;}
  .stat .num{font-size:22px;font-weight:700;}
  .stat .lab{font-size:11.5px;color:var(--text-mute);}

  .health-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
  .health-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 15px;}
  .hc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .hc-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .hc-dot.green{background:var(--success);} .hc-dot.amber{background:var(--amber);} .hc-dot.red{background:var(--coral);}
  .hc-top .name{font-size:13px;font-weight:700;}
  .hc-score{font-size:20px;font-weight:700;margin-bottom:6px;}
  .hc-bar-track{height:5px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:8px;}
  .hc-bar-fill{height:100%;border-radius:4px;}
  .hc-note{font-size:11.5px;color:var(--text-mute);}

  .alert-feed{display:flex;flex-direction:column;}
  .alert-row{display:flex;gap:11px;padding:11px 2px;border-top:1px solid var(--border-soft);}
  .alert-row:first-child{border-top:none;}
  .alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto;}
  .alert-row.amber .alert-dot{background:var(--amber);}
  .alert-row.green .alert-dot{background:var(--success);}
  .alert-text{font-size:12.8px;color:var(--text-dim);line-height:1.5;}
  .alert-time{font-size:11px;color:var(--text-mute);margin-top:2px;}

  .section-label{font-size:11px;font-weight:700;color:var(--text-mute);text-transform:none;margin-bottom:12px;}

  .cte-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .cte-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:20px;display:flex;flex-direction:column;gap:10px;
  }
  .cte-card h3{font-size:15px;font-weight:700;color:var(--accent);}
  .cte-card p{font-size:12.8px;color:var(--text-dim);line-height:1.5;flex:1;}
  .cte-card .btn{align-self:flex-start;margin-top:2px;}
  .btn.btn-done{opacity:1;background:var(--success);color:var(--success-ink);}

  .ingestion-panel{margin-bottom:14px;}
  .ingest-row{display:flex;align-items:center;gap:14px;}
  .ingest-icon{width:38px;height:38px;border-radius:10px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}
  .ingest-text{display:flex;flex-direction:column;flex:1;min-width:0;}
  .ingest-text strong{font-size:13px;}
  .ingest-text span{font-size:11.5px;color:var(--text-mute);margin-top:2px;}

  .cte-checklists{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cte-checklists .agent-card{padding:20px;}

  .banner-complete{
    margin-top:16px;background:rgba(62,213,152,.14);color:var(--success);
    border:1px solid rgba(62,213,152,.3);border-radius:var(--radius-md);
    padding:12px 16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;
    opacity:0;transform:translateY(4px);transition:opacity .25s ease, transform .25s ease;
  }
  .banner-complete.show{opacity:1;transform:translateY(0);}

  .acc-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .acc-row{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--panel);overflow:hidden;}
  .acc-head{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;user-select:none;}
  .acc-head:hover{background:rgba(255,255,255,.03);}
  .acc-chevron{display:inline-flex;color:var(--text-mute);font-size:13px;transition:transform .2s ease,color .2s ease;flex:0 0 auto;}
  .acc-row.open .acc-chevron{transform:rotate(90deg);color:var(--accent);}
  .acc-title{font-size:13.5px;font-weight:600;color:var(--text-dim);}
  .acc-row.open .acc-title{color:var(--text);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .acc-body-inner{padding:0 16px 18px;}

  .status-banner{
    border-radius:var(--radius-md);padding:11px 14px;font-size:12.8px;font-weight:600;
    display:flex;align-items:center;gap:9px;margin-top:2px;
  }
  .status-banner .sb-mark{flex:0 0 auto;font-weight:800;font-size:13px;line-height:1;}
  .status-banner.green{background:rgba(62,213,152,.14);color:var(--success);border:1px solid rgba(62,213,152,.3);}
  .status-banner.red{background:rgba(255,79,89,.14);color:var(--coral);border:1px solid rgba(255,79,89,.3);}
  .status-banner.amber{background:rgba(255,194,75,.14);color:var(--amber);border:1px solid rgba(255,194,75,.3);}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,10px);background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s ease, transform .25s ease;
    z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast svg{color:var(--success);}
  .out-foot{margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .out-foot .next-agent{font-size:12px;color:var(--text-mute);}
  .overflow-x{overflow-x:auto;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex:0 0 auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:14px 16px;}
    .stepper{flex-direction:row;gap:0;}
    .step-node::before{display:none;}
    .step-node{flex-direction:column;align-items:center;gap:4px;padding:4px 10px;}
    .node-body{align-items:center;text-align:center;}
    .node-sub{display:none;}
    .rp-widget{display:none;}
    .sidebar-foot{display:none;}
    .main{padding:24px 18px 44px;max-width:100%;}
    .fivewh{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr;}
    .health-grid{grid-template-columns:1fr;}
    .cte-grid{grid-template-columns:1fr;}
    .cte-checklists{grid-template-columns:1fr;}
    .ingest-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CQ</div>
      <div class="brand-text"><strong>ControlIQ</strong><span>Genpact - AI Control Testing</span></div>
    </div>
    <nav class="stepper" id="stepper"></nav>
    <div class="rp-widget" id="rpWidget">
      <div class="rp-head"><span class="rp-pulse"></span> Resource Planner <span class="rp-tag">cross-cutting</span></div>
      <div class="rp-row"><span>Pipeline progress</span><strong id="rpProgress">0%</strong></div>
      <div class="rp-bar-track"><div class="rp-bar-fill" id="rpBarFill"></div></div>
      <div class="rp-row"><span>Controls tracked</span><strong id="rpControls">-</strong></div>
      <div class="rp-row"><span>Tester utilization</span><strong id="rpUtil">-</strong></div>
    </div>
    <div class="sidebar-foot">Demo environment - every figure on this screen is illustrative sample data.</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const CONTROLS = [
  {
    id:'JEA', name:'Journal Entry Approval Control', type:'Preventive',
    blurb:'Manual journal entries above $50,000 require secondary approval before posting to the GL.',
    risk:'High', riskKey:'high',
    questions:[
      'Is there a system-enforced threshold requiring approval above $50,000?',
      'Does the approver have appropriate segregation of duties from the preparer?'
    ],
    narrative:'Manual journal entries exceeding $50,000 are routed through a system-enforced approval workflow in Oracle Financials prior to posting. The preparer and approver are system-restricted to distinct roles, ensuring segregation of duties. Approval evidence is retained in the system audit log for the full retention period.',
    testStep:'Select a sample of manual journal entries posted during the period and verify secondary approval evidence exists prior to posting.',

function icon(name){

    case 'search': return `<svg ${s}><circle cx="10.5" cy="10.5" r="6.5"/><line x1="19" y1="19" x2="15.4" y2="15.4"/></svg>`;

    case 'flask': return `<svg ${s}><path d="M9 3h6"/><path d="M10 3v6.5L4.8 18a1.6 1.6 0 001.4 2.4h11.6a1.6 1.6 0 001.4-2.4L14 9.5V3"/><line x1="8" y1="15" x2="16" y2="15"/></svg>`;
    case 'pulse': return `<svg ${s}><path d="M3 12h4l2.5-6 4 12 2-6H21"/></svg>`;
    case 'upload': return `<svg ${s}><path d="M12 16V4"/><path d="M7 8l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>`;

let state = { screen:'upload', stage:0, completed:new Set(), fileChosen:false };
const mainEl = document.getElementById('main');

function stageStatus(n){
  if(state.completed.has(n)) return 'done';
  if(n === state.stage) return 'active';
  return 'locked';
}

function renderSidebar(){
  const stepper = document.getElementById('stepper');
  stepper.innerHTML = Object.keys(STAGE_META).map(k=>{
    const n = parseInt(k);
    const st = stageStatus(n);
    const meta = STAGE_META[n];
    const clickable = st === 'done' || (st==='active' && state.screen==='output');
    const inner = st==='done' ? icon('check') : n;
    return `<div class="step-node${clickable?' clickable':''}" data-status="${st}" ${clickable?`onclick="viewOutput(${n})" style="cursor:pointer"`:''}>
      <div class="node-dot">${inner}</div>
      <div class="node-body">
        <span class="node-label">${meta.label}</span>
        <span class="node-sub">${st==='done'?'Complete':st==='active'?(state.screen==='working'?'Agent working...':'In progress'):'Pending'}</span>
      </div>
    </div>`;
  }).join('');
  updateResourcePlanner();
}

function updateResourcePlanner(){
  const done = state.completed.size;
  const pct = Math.round((done/6)*100);
  document.getElementById('rpProgress').textContent = pct + '%';
  document.getElementById('rpBarFill').style.width = pct + '%';
  document.getElementById('rpControls').textContent = done >= 1 ? '4 identified' : '-';
  document.getElementById('rpUtil').textContent = RP_UTIL[done];
}

function viewOutput(n){
  if(!state.completed.has(n)) return;
  state.screen='output'; state.stage=n;
  renderSidebar();
  mainEl.innerHTML = outputScreenHTML(n);
  if(n===6) startLiveTicker();
}

function animateChecklist(containerId, onDone){
  const rows = document.querySelectorAll('#'+containerId+' .step-row');
  const tags = document.querySelectorAll('#'+containerId+' .step-tag');
  let i = 0;
  function step(){
    if(i>0){
      rows[i-1].classList.remove('active');
      rows[i-1].classList.add('done');
      tags[i-1].textContent = 'Done';
    }
    if(i < rows.length){
      rows[i].classList.add('active');
      tags[i].textContent = 'In progress';
      i++;
      setTimeout(step, 850);
    } else if(onDone){
      onDone();
    }
  }
  step();
}

function startCteChecklist(which){
  if(which === 1){
    const btn = document.getElementById('cteBtn1');
    btn.disabled = true; btn.textContent = 'Running...';
    animateChecklist('cteSteps1', ()=>{
      btn.textContent = 'Completed'; btn.classList.add('btn-done');
      document.getElementById('cteBtn2').disabled = false;
    });
  } else {
    const btn2 = document.getElementById('cteBtn2');
    btn2.disabled = true; btn2.textContent = 'Running...';
    animateChecklist('cteSteps2', ()=>{
      btn2.textContent = 'Completed'; btn2.classList.add('btn-done');
      document.getElementById('cteCompleteBanner').classList.add('show');
      document.getElementById('continueBtn').classList.add('show');
    });
  }
}

function animateSteps(){
  const rows = document.querySelectorAll('#agentSteps .step-row');
  const tags = document.querySelectorAll('#agentSteps .step-tag');
  let i = 0;
  function step(){
    if(i>0){
      rows[i-1].classList.remove('active');
      rows[i-1].classList.add('done');
      tags[i-1].textContent = 'Done';
    }
    if(i < rows.length){
      rows[i].classList.add('active');
      tags[i].textContent = 'In progress';
      i++;
      setTimeout(step, 1000);
    } else {
      const btn = document.getElementById('continueBtn');
      if(btn) btn.classList.add('show');
    }
  }
  step();
}

function statusBanner(kind, mark, text){
  return `<div class="status-banner ${kind}"><span class="sb-mark">${mark}</span><span>${text}</span></div>`;
}

function accordionRow(id, title, contentHTML){
  return `<div class="acc-row" id="acc-${id}">
    <div class="acc-head" onclick="toggleAcc('${id}')">
      <span class="acc-chevron" id="chev-${id}">></span>
      <span class="acc-title">${title}</span>
    </div>
    <div class="acc-body" id="body-${id}"><div class="acc-body-inner">${contentHTML}</div></div>
  </div>`;
}

function toggleAcc(id){
  const row = document.getElementById('acc-'+id);
  const body = document.getElementById('body-'+id);
  const isOpen = row.classList.contains('open');
  if(isOpen){
    row.classList.remove('open');
    body.style.maxHeight = '0px';
  } else {
    row.classList.add('open');
    body.style.maxHeight = body.firstElementChild.scrollHeight + 'px';
  }
}

function vendorChangeTable(){
  return `<div class="overflow-x" style="margin-top:12px;">
    <table class="dtable">
      <tr><th>change_id</th><th>change_date</th><th>vendor_id</th><th>vendor_name</th><th>field_changed</th><th>requested_by</th><th>verified_by</th><th>status</th></tr>
      ${VENDOR_CHANGES.map(v=>`<tr>
        <td class="strong">${v.id}</td><td>${v.date}</td><td>${v.vendor}</td><td>${v.name}</td><td>${v.field}</td>
        <td>${v.requestedBy}</td><td>${v.verifiedBy}</td>
        <td style="color:${v.exception?'var(--coral)':'var(--text-dim)'};font-weight:${v.exception?'700':'400'};">${v.status}${v.exception?' - '+v.exceptionType:''}</td>
      </tr>`).join('')}
    </table>
  </div>`;
}

        <div class="stat"><div class="num">95</div><div class="lab">Changes with Verification Evidence</div></div>
        <div class="stat"><div class="num">1</div><div class="lab">Gap (Missing Reviews)</div></div>
      </div>
      ${statusBanner('red','X','1 Q4 vendor banking-detail change missing independent verification evidence.')}
      ${vendorChangeTable()}
    `),
    accordionRow('anomaly', 'Anomaly Detection - Exceptions & Escalation Review', `
      <div class="stat-row">
        <div class="stat"><div class="num">1</div><div class="lab">Exceptions Identified</div></div>
        <div class="stat"><div class="num">1</div><div class="lab">Escalated to Control Owner</div></div>

        </table>
      </div>
    `),
    accordionRow('timeliness', 'Operating Effectiveness Results - Validation of Review Timeliness', `
      <div class="stat-row">
        <div class="stat"><div class="num">95</div><div class="lab">Reviews Within SLA</div></div>
        <div class="stat"><div class="num">1</div><div class="lab">Open Breach(es)</div></div>
        <div class="stat"><div class="num">99%</div><div class="lab">On-Time Rate</div></div>
      </div>
      ${statusBanner('red','X','1 vendor change review was not completed within the 2-business-day SLA.')}
      <div class="overflow-x" style="margin-top:12px;">
        <table class="dtable">
          <tr><th>change_id</th><th>change_date</th><th>verification_due</th><th>verification_completed</th><th>delay</th></tr>
          <tr><td class="strong">VMC-2034</td><td>2024-11-12</td><td>2024-11-14</td><td style="color:var(--coral);font-weight:700;">Not completed</td><td style="color:var(--coral);font-weight:700;">5+ days (open)</td></tr>
        </table>
      </div>
    `),
    accordionRow('eligibility', 'Operating Effectiveness Results - Reviewer Eligibility Check', `
      <div class="stat-row">
        <div class="stat"><div class="num">96</div><div class="lab">Changes Checked</div></div>
        <div class="stat"><div class="num">0</div><div class="lab">Segregation-of-Duty Violations</div></div>

      </div>
      ${statusBanner('green','OK','No segregation-of-duty violations - no reviewer verified their own change request.')}
      <div class="overflow-x" style="margin-top:12px;">
        <table class="dtable">
          <tr><th>change_id</th><th>requested_by</th><th>verified_by</th><th>same_person</th><th>eligible</th></tr>
          ${VENDOR_CHANGES.map(v=>`<tr>
            <td class="strong">${v.id}</td><td>${v.requestedBy}</td><td>${v.verifiedBy}</td>
            <td>${v.verifiedBy==='-' ? 'N/A' : 'No'}</td>
            <td style="color:${v.verifiedBy==='-' ? 'var(--text-mute)' : 'var(--success)'};font-weight:700;">${v.verifiedBy==='-' ? 'N/A' : 'Yes'}</td>
          </tr>`).join('')}
        </table>
      </div>
    `),
    accordionRow('perfunctory', 'Operating Effectiveness Results - Perfunctory Review Check', `
      <div class="stat-row">
        <div class="stat"><div class="num">7</div><div class="lab">Reviews Analyzed</div></div>
        <div class="stat"><div class="num">0</div><div class="lab">Flagged as Perfunctory</div></div>
        <div class="stat"><div class="num">&lt;10 min</div><div class="lab">Flag Threshold</div></div>
      </div>
      ${statusBanner('green','OK','No perfunctory reviews identified - every verification exceeded the minimum review-duration threshold.')}
      <div class="overflow-x" style="margin-top:12px;">
        <table class="dtable">
          <tr><th>change_id</th><th>verified_by</th><th>verification_started</th><th>verification_completed</th><th>review_duration</th><th>flagged</th></tr>
          ${VENDOR_CHANGES.filter(v=>!v.exception).map((v,i)=>{
            const durations=['18 min','24 min','31 min','12 min','27 min','19 min','22 min'];
            return `<tr>
              <td class="strong">${v.id}</td><td>${v.verifiedBy}</td><td>${v.date} 09:1${i}</td><td>${v.date} 09:3${i}</td>

  return headerBlock(5, 'Control testing results', 'The Evidence Collection & Assessment Agent and TOE Agent completed autonomous testing. Drill into each check below - shown here for the Vendor Master File Change Control.') + `
  ${summaryTable}
  <div class="section-label" style="margin-top:16px;">Agent output - drill into each check</div>
  <div class="acc-list">${rows.join('')}</div>
  <button class="btn btn-primary" onclick="generateExcel()">Generate Excel Output</button>
  ` + footerBlock(5);
}

function generateExcel(){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon('check')} Excel output generated (demo only)`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(), 300);
  }, 2400);
}

function outputCCM(){
  return headerBlock(6, 'Continuous control monitoring', 'Each tested control is now on live monitoring, with automatic anomaly detection and alerting.') + `
  <div class="panel">
    <div class="section-label" style="display:flex;align-items:center;gap:8px;">Control health <span class="badge live"><span class="lv-dot"></span> Live</span></div>
    <div class="health-grid">
      ${CONTROLS.map(c=>`
        <div class="health-card">
          <div class="hc-top"><span class="hc-dot ${c.healthKey}"></span><span class="name">${c.name}</span></div>
          <div class="hc-score">${c.health}%</div>
          <div class="hc-bar-track"><div class="hc-bar-fill" style="width:${c.health}%;background:${c.healthKey==='green'?'var(--success)':c.healthKey==='amber'?'var(--amber)':'var(--coral)'}"></div></div>
          <div class="hc-note">${c.healthNote}</div>

    <div class="section-label">Alert feed</div>
    <div class="alert-feed" id="alertFeed">
      <div class="alert-row amber"><div class="alert-dot"></div><div><div class="alert-text">Vendor Master File Change - banking detail change flagged outside approval window.</div><div class="alert-time" data-mins="4">4 min ago</div></div></div>
      <div class="alert-row green"><div class="alert-dot"></div><div><div class="alert-text">User Access Recertification - quarterly recertification completed on schedule.</div><div class="alert-time" data-mins="192">3 hr ago</div></div></div>
      <div class="alert-row green"><div class="alert-dot"></div><div><div class="alert-text">Payment Batch Authorization - batch authorized within SLA, no exceptions.</div><div class="alert-time" data-mins="311">5 hr ago</div></div></div>
    </div>
  </div>
  ` + footerBlock(6);
}

let liveTicker = null;
function startLiveTicker(){
  if(liveTicker) clearInterval(liveTicker);
  liveTicker = setInterval(()=>{
    const rows = document.querySelectorAll('#alertFeed .alert-time');
    if(!rows.length){ clearInterval(liveTicker); return; }
    rows.forEach(r=>{
      let mins = parseInt(r.dataset.mins || '0') + 1;
      r.dataset.mins = mins;
      r.textContent = mins < 60 ? `${mins} min ago` : `${Math.round(mins/60)} hr ago`;
    });
  }, 4000);
}
